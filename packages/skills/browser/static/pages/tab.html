/* A tab's page: the workspace's tabs along the top, the address bar, the tab's picture filling the
   room, who holds a chat's tab, and Back, Forward, Logins and More at the bottom. Tap the picture to
   take the tab over; tap a field to type with this device's keyboard. The tab's screen follows the
   picture's room, so it fills a phone or a desktop window alike. A sign-in request, and an offer to
   save a login, rise as a card at the bottom. + and More › New tab show a new tab's home, where a
   search or an address opens a tab of the user's own; More there has New tab alone. A tab that closed
   keeps all of it, the tab's room alone changing: its other tabs stay along the top, a new tab's home
   takes the tab's place, and Back and Forward are off. Inside AnywhereLLM Lite, which draws its own
   bar for handing the tab back, the bar saying who holds the tab is left out. It draws no Close of
   its own: it opens in a sheet whose toolbar shows its <title> (the tab's) and a Close (AnywhereLLM
   Lite's Custom Tab), or in a browser tab with its own Back. ?theme=light or dark keeps it to one,
   as the Vault's does. */

html { font-size: 100%; }
@supports (font: -apple-system-body) and (-webkit-touch-callout: none) { html { font: -apple-system-body; } }
.hu-root {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  --control-h: var(--size-control-touch);
  --primary-h: var(--size-primary);
  --target: var(--size-target-touch);
  --tile-pad: var(--space-4);
  --tile-radius: var(--radius-lg);
  --group-radius: var(--radius-xl);
  --row-h: var(--size-row-touch);
  --table-row-h: var(--size-row-table);
  --table-pad-x: var(--space-3);
  /* Tab bar: padding, a 32px indicator, a 2px gap and two lines of caption text */
  --nav-label: min(0.8125rem, 16px);
  --nav-h: max(var(--size-tabbar), calc(3 * var(--space-1) + 34px + 2 * 1.2 * var(--nav-label)));
}
@media (pointer: fine) and (hover: hover) and (not (any-pointer: coarse)) {
  .hu-root:not([data-density="touch"]) {
    --control-h: var(--size-control-pointer);
    --primary-h: var(--size-control-pointer);
    --target: max(var(--size-target-pointer), 1.5rem);
    --tile-pad: var(--space-3);
    --row-h: var(--size-row-pointer);
    --table-pad-x: var(--space-2);
  }
}
.hu-root[data-density="pointer"] {
  --control-h: var(--size-control-pointer);
  --primary-h: var(--size-control-pointer);
  --target: max(var(--size-target-pointer), 1.5rem);
  --tile-pad: var(--space-3);
  --row-h: var(--size-row-pointer);
  --table-pad-x: var(--space-2);
}
.hu-root *, .hu-root *::before, .hu-root *::after { box-sizing: border-box; }

    if (offer) {
      const passkey = st.offer.kind === "passkey";
      $("offerwhat").textContent = passkey ? "Save this passkey?" : "Save this login?";
      $("offerwho").textContent = st.offer.site + (st.offer.user ? " · " + st.offer.user : passkey ? " · passkey" : "");
    }
    document.body.classList.toggle("carded", ask || offer);
    document.body.classList.toggle("offered", offer);
    // The tab, or a new tab's home.
    $("addrbar").hidden = $("stage").hidden = homeView;
    $("searchbar").hidden = $("home").hidden = !homeView;
    drawStrip();
    if (homeView) drawSites();
    const secure = /^https:/i.test(st.url || "");
    $("lock").replaceChildren(icon(secure ? "lock" : "open"));
    $("lock").setAttribute("aria-label", secure ? "Secure" : "Not secure");
    $("lock").setAttribute("role", "img");
    $("addr").textContent = st.host || (st.url || "").replace(/^[a-z]+:(\/\/)?/i, "") || "New tab";
    document.title = homeView ? "New tab" : st.title || st.host || "Browser"; // what the sheet's toolbar shows
    // Who holds a chat's tab; a tab the user opened is theirs, with no such bar.
    $("holdbar").hidden = homeView || st.mine || !!host;
    $("holddot").hidden = held;
    $("holdtext").textContent = held ? "You have this tab" : "The agent is using this tab";
    $("hold").textContent = held ? "Hand back" : "Take over";
    $("navback").disabled = homeView || !st.back;
    $("navfwd").disabled = homeView || !st.forward;
    // More stays, as every tool does whatever shows: New tab alone on a new tab's home, where the
    // tab under it isn't in view to close, and once the tab is gone.
    $("moreclose").hidden = homeView || !!gone;
    $("logins").hidden = !st.vault;
    if (st.vault) $("logins").href = st.vault;
    $("take").hidden = held || homeView;
    tell(st.who);
    reserve();
    layout();
    if (first) first.focus();
  }

  // A gone tab's state, as this page draws it: no page of its own, only the frame. A closed one's
  // has the workspace's open tabs, its sites and the Vault's link; a stopped one's tabs went with its
  // browser.
  const goneState = (s, how) => ({
    title: "", url: "", host: "", mine: true, tabs: how === "closed" ? s.tabs || [] : [], sites: s.sites || [],
    shot, until: s.until, who: "agent", fields: [], need: null, offer: null, msg: s.msg || null, vault: s.vault || null,
  });

  // The state file, asked for often while a step is pending and less when idle.
  async function poll() {
    if (document.hidden && st) return; // out of sight: no polling, but the first state still draws
    let next, text;
    try {
      const r = await fetch(cfg.token + ".json", { cache: "no-cache" });
      const d = Date.parse(r.headers.get("Date") || "");
      if (d) skew = d - Date.now();
      text = await r.text();
      next = JSON.parse(text);
    } catch (e) {
      return; // not reached, or not the state file: the next poll tries again
    }
    // Closed, or its browser's time ran out: AnythingLLM restarted under it, which writes no "closed".
    const before = gone;
    gone = next.closed ? "closed" : next.until > Date.now() + skew ? null : "stopped";
    if (gone && awaiting?.next) return goTo(awaiting.next.path); // closed from here: on to the next tab
    if (gone) next = goneState(next, gone);
    const same = text === lastText && gone === before;
    if (!same) {
      const first = !st;
      const fresh = shot !== 0; // a line already there when the page opened isn't news
      st = next;
      if (gone && !before) {
        // Gone now (or when the page opened): its home in its place, as + shows it, keeping what was typed there.
        closeField(false);
        settled();
        if (!homeView) setHome(true), ($("q").value = ""), suggest();
        toast("This tab closed");
      }
      if (!gone && st.shot !== shot) {
        shot = st.shot;
        slide(0);
        if (st.size) size = st.size;
        $("shot").src = cfg.token + ".jpg?v=" + shot;
        if (pending && shot !== pending.from) settled();
      }
      // A line stays a while: shown once (a gone tab's: why a tab didn't open).
      const news = gone ? !first : fresh;
      if (st.msg && st.msg.id !== shown) (news && toast(st.msg.text)), (shown = st.msg.id);
      if (first) askSize(); // the first state: ask for this window's room
    }
    // A tab asked for from here: gone to once it's listed. A line said meanwhile is the answer (why it
    // didn't open, or why this one didn't close).
    const made = awaiting?.made && (st.tabs || []).find((t) => t.made === awaiting.made);
    if (made) return goTo(made.path);
    if (awaiting && (shown !== awaiting.shown || Date.now() > awaiting.until)) {
      const opening = !!awaiting.made;
      if (opening && shown === awaiting.shown) toast(gone ? "Nothing answered. Ask the agent in the chat to open a page, then try again." : "The tab didn’t open. Try again in a moment.");
      awaiting = null;
      if (opening) settled();
    }
    const was = st.who;
    if (pending && pending.who) st.who = pending.who; // taken or handed back here; the state file catches up
    // What a field being typed into would lose is drawn once it closes; the request's card is kept
    // while its request is.
    if ((!same || st.who !== was) && !over) (lastText = text), paint();
  }
  // A gone tab's state changes only as tabs come and go: asked for less often, and no more once its
  // page may ask for nothing (its time up, or no `until`). A post asks again soon.
  let pollTimer = 0;
  function loop() {
    poll().finally(() => {
      clearTimeout(pollTimer);
      if (pending || awaiting) return void (pollTimer = setTimeout(loop, 250));
      if (gone === "closed" && !(st.until > Date.now() + skew)) return;
      pollTimer = setTimeout(loop, gone ? 15000 : 2000);
    });
  }
  function soon() {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(loop, 250);
  }
  reserve();
  loop();
  document.addEventListener("visibilitychange", poll);
})();
</script>
</body>
</html>
