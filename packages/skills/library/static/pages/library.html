html { font-size: 100%; }
@supports (font: -apple-system-body) and (-webkit-touch-callout: none) { html { font: -apple-system-body; } }
.hu-root {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  --control-h: var(--size-control-touch);
  --primary-h: var(--size-primary);
  --target: var(--size-target-touch);
  --tile-pad: var(--space-4);
  --tile-radius: var(--radius-lg);
  --group-radius: var(--radius-xl);
  --row-h: var(--size-row-touch);
  --table-row-h: var(--size-row-table);
  --table-pad-x: var(--space-3);
  /* Tab bar: padding, a 32px indicator, a 2px gap and two lines of caption text */
  --nav-label: min(0.8125rem, 16px);
  --nav-h: max(var(--size-tabbar), calc(3 * var(--space-1) + 34px + 2 * 1.2 * var(--nav-label)));
}
@media (pointer: fine) and (hover: hover) and (not (any-pointer: coarse)) {
  .hu-root:not([data-density="touch"]) {
    --control-h: var(--size-control-pointer);
    --primary-h: var(--size-control-pointer);
    --target: max(var(--size-target-pointer), 1.5rem);
    --tile-pad: var(--space-3);
    --row-h: var(--size-row-pointer);
    --table-pad-x: var(--space-2);
  }
}
.hu-root[data-density="pointer"] {
  --control-h: var(--size-control-pointer);
  --primary-h: var(--size-control-pointer);
  --target: max(var(--size-target-pointer), 1.5rem);
  --tile-pad: var(--space-3);
  --row-h: var(--size-row-pointer);
  --table-pad-x: var(--space-2);
}
.hu-root *, .hu-root *::before, .hu-root *::after { box-sizing: border-box; }
.hu-root :focus-visible { outline: var(--size-focus) solid var(--focus); outline-offset: 3px; }

<body class="hu-root">
<div class="view" id="home">
  <div class="top"><h1 tabindex="-1">Library</h1></div>
  <nav role="tablist" aria-label="Show">
    <button role="tab" data-tab="toolkits" aria-selected="true">Toolkits</button>
    <button role="tab" data-tab="machines" aria-selected="false">Machines</button>
    <button role="tab" data-tab="runs" aria-selected="false">Runs</button>
  </nav>
  <div id="tab" class="view" style="padding:0;width:100%" role="tabpanel"></div>
  <button class="btn ghost" type="button" id="rotate">Replace link</button>
</div>
<div class="view" id="screen" hidden></div>
<div class="menu" id="menu" role="menu" hidden></div>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-t" aria-describedby="sheet-b">
  <span class="grip" aria-hidden="true"></span>
  <form method="dialog" class="sheetin">
    <div><h2 id="sheet-t"></h2><p class="say" id="sheet-b"></p></div>
    <div class="acts"><button class="btn pri" value="keep" id="sheet-keep">Keep</button><button class="btn del" value="yes" id="sheet-yes"></button></div>
  </form>
</dialog>
<div id="toast" role="status" hidden></div>
<script>
(() => {
  const cfg = /*CONFIG*/null;
  const theme = new URLSearchParams(location.search).get("theme");
  if (/^(light|dark)(-hc)?$/.test(theme ?? "")) document.documentElement.dataset.theme = theme; // House UI's four themes
  const $ = (id) => document.getElementById(id);
  /** An element: `props` set as properties, `attrs` as attributes, then its children. */
  const el = (tag, props = {}, ...kids) => {
    const { attrs = {}, ...rest } = props;
    const n = Object.assign(document.createElement(tag), rest);
    for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? "" : String(v));
    n.append(...kids.flat().filter((k) => k !== null && k !== undefined && k !== false));
    return n;
  };
  const ICONS = {
    more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
    next: '<path d="m9 18 6-6-6-6"/>',
    down: '<path d="m6 9 6 6 6-6"/>',
    back: '<path d="m15 18-6-6 6-6"/>',
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
    lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    spin: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
    done: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    failed: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    stop: '<circle cx="12" cy="12" r="10"/><rect x="9" y="9" width="6" height="6" rx="1"/>',
    alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
    warn: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  };
  const icon = (name, size = 16, cls = "") => Object.assign(document.createElement("template"), { innerHTML: `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>` }).content.firstChild;
  let toastTimer = 0;
  const toast = (text) => { $("toast").textContent = text; $("toast").hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => ($("toast").hidden = true), 4000); };

  // ---- Posting: each thing done here is an event, posted through AnythingLLM's upload.
  async function post(ev, fields = {}) {
    const event = { library_lean_event: 1, secret: cfg.secret, ev, ...fields, t: new Date().toISOString() };
    try {
      const res = await fetch("/api/browser-extension/upload-content", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + cfg.key },
        body: JSON.stringify({ textContent: JSON.stringify(event), metadata: { title: cfg.title, docSource: "library-lean page" } }),
      });
      if (!res.ok) return toast(res.status === 403 ? "AnythingLLM refused the pages’ key: make a new one in Settings › Browser Extension, paste it into a suite skill’s PAGE_KEY, then reload this page" : `AnythingLLM answered ${res.status}. Try again in a moment.`), false;
      toast("Sent");
      setTimeout(load, 1500);
      return true;
    } catch (e) {
      toast("Can’t reach AnythingLLM. Check your connection, then try again.");
      return false;
    }
  }

  // RSA-OAEP seals at most 190 bytes; a longer value (a private key, say) is sealed with a new
  // AES-GCM key, itself sealed with RSA: "h1.<sealed key>.<iv>.<sealed value>".
  const b64 = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)));
  let pubKey = null;
  async function seal(text) {
    const bytes = new TextEncoder().encode(text);
    pubKey ||= await crypto.subtle.importKey("spki", Uint8Array.from(atob(cfg.pub), (c) => c.charCodeAt(0)), { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
    if (bytes.length <= 190) return b64(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pubKey, bytes));
    const aes = crypto.getRandomValues(new Uint8Array(32));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await crypto.subtle.importKey("raw", aes, "AES-GCM", false, ["encrypt"]);
    const sealed = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes);
    return ["h1", b64(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pubKey, aes)), b64(iv), b64(sealed)].join(".");
  }

  // ---- Pieces.
  const say = (text) => el("p", { className: "say", textContent: text });
  const cap = (text, mono = false) => el("p", { className: "cap" + (mono ? " mono" : ""), textContent: text });
  const card = (...kids) => el("div", { className: "card" }, ...kids);
  const tag = (text, kind, glyph) => el("span", { className: `tag ${kind}` }, glyph ? icon(glyph, 14) : null, text);
  const btn = (text, kind, label, onclick) => el("button", { className: `btn ${kind}`, type: "button", textContent: text, onclick, attrs: { "aria-label": label } });
  const acts = (...kids) => el("div", { className: "acts" }, ...kids);
  const rowLink = (href, ...kids) => el("a", { className: "row", href }, el("span", { className: "txt" }, ...kids), icon("next"));
  const list = (items) => new Intl.ListFormat("en", { type: "conjunction" }).format(items);
  // The skill's own words as a sentence of the page's: a capital, a full stop, the curly apostrophe.
  const sentence = (text) => { const line = String(text ?? "").trim().replace(/'/g, "’"); return line ? line[0].toUpperCase() + line.slice(1).replace(/[.:]?$/, ".") : ""; };
  // Copies `text`; where the clipboard is refused, selects it to copy by hand.
  const copier = (text, pre) => () => navigator.clipboard.writeText(text()).then(() => toast("Copied"), () => getSelection().selectAllChildren(pre));
  const copyBtn = (label, text, pre) => el("button", { className: "btn", type: "button", onclick: copier(text, pre), attrs: { "aria-label": label } }, icon("copy", 18), "Copy");

  // ---- The one command a machine is set up with: it adds the page's key to the account's
  // authorized_keys (once: a line with that key already there is kept) with the right permissions,
  // and prints the host key's fingerprint. Run with sh, so it reads the same in any login shell.
  const NAME = /^[a-z][a-z0-9-]{1,30}$/;
  const KEYGEN = "ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub";
  function setupCommand(keyLine, name) {
    const [type, body] = String(keyLine ?? "").trim().split(/\s+/);
    if (!/^ssh-[a-z0-9-]+$/.test(type ?? "") || !/^[A-Za-z0-9+/]+=*$/.test(body ?? "")) return null;
    const line = `restrict ${type} ${body} library-lean${NAME.test(name) ? ` ${name}` : ""}`;
    return `sh -c 'mkdir -p ~/.ssh && touch ~/.ssh/authorized_keys && chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys && { grep -qF "${body}" ~/.ssh/authorized_keys || echo "${line}" >> ~/.ssh/authorized_keys; } && ${KEYGEN}'`;
  }
  /** A machine's address as the user types it: the port only when it isn't 22. */
  const addressOf = (m) => (m.port === 22 ? m.host : m.host.includes(":") ? `[${m.host}]:${m.port}` : `${m.host}:${m.port}`);

  // ---- The sheet that asks first, and the ⋯ menu.
  const sheet = $("sheet");
  let asked = null;
  function ask(title, body, yes, act) {
    $("sheet-t").textContent = title;
    $("sheet-b").textContent = body;
    $("sheet-yes").textContent = yes;
    asked = { act, from: document.activeElement };
    sheet.returnValue = "";
    sheet.showModal();
    $("sheet-keep").focus();
  }
  sheet.addEventListener("close", () => {
    const was = asked;
    asked = null;
    if (was?.from?.isConnected) was.from.focus();
    if (was && sheet.returnValue === "yes") was.act();
  });
  sheet.addEventListener("click", (e) => e.target === sheet && sheet.close("keep")); // the scrim

  const menu = $("menu");
  let menuFrom = null;
  function closeMenu() {
    if (menu.hidden) return;
    menu.hidden = true;
    menuFrom?.setAttribute("aria-expanded", "false");
    if (menuFrom?.isConnected) menuFrom.focus();
  }
  function moreButton(label, items, cls = "more") {
    const b = el("button", { className: cls, type: "button", attrs: { "aria-label": label, "aria-haspopup": "menu", "aria-expanded": "false" } }, icon("more", 20));
    b.onclick = () => {
      closeMenu();
      menu.replaceChildren(...items.map(([text, act]) => el("button", { type: "button", textContent: text, attrs: { role: "menuitem" }, onclick: () => (closeMenu(), act()) })));
      menu.hidden = false;
      const box = b.getBoundingClientRect();
      const below = box.bottom + 4 + menu.offsetHeight <= innerHeight;
      menu.style.top = `${below ? box.bottom + 4 : Math.max(8, box.top - 4 - menu.offsetHeight)}px`;
      menu.style.right = `${Math.max(8, innerWidth - box.right)}px`;
      b.setAttribute("aria-expanded", "true");
      menuFrom = b;
      menu.firstChild.focus();
    };
    return b;
  }
  // ⋯ › Delete, which asks first and then posts `ev`; `after` follows a delete that was sent.
  const deleteMenu = (name, body, ev, fields, { cls, after } = {}) =>
    moreButton(`More for ${name}`, [["Delete", () => ask(`Delete ${name}?`, body, "Delete", () => post(ev, fields).then((sent) => sent && after?.()))]], cls);
  document.addEventListener("pointerdown", (e) => !menu.hidden && !menu.contains(e.target) && !e.target.closest?.("[aria-haspopup]") && closeMenu());
  document.addEventListener("keydown", (e) => e.key === "Escape" && !menu.hidden && closeMenu());

  // ---- What a function does, and how a run went.
  const does = (f) => { const d = String(f.description ?? "").trim(); return (d.match(/^.*?[.!?](?=\s|$)/)?.[0] ?? d).replace(/\.$/, "") || f.name; };
  const RUN = { running: ["Running", "", "spin"], ok: ["Done", "ok", "done"], error: ["Failed", "bad", "failed"], timeout: ["Timed out", "warn", "clock"], stopped: ["Stopped", "", "stop"], interrupted: ["Interrupted", "warn", "alert"] };
  const runTag = (status) => tag(...(RUN[status] ?? [status, "", null]));
  const hm = (d) => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  function dayOf(d) {
    const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const ago = Math.round((day(new Date()) - day(d)) / 86400000);
    return ago === 0 ? "Today" : ago === 1 ? "Yesterday" : d.toLocaleDateString([], { month: "short", day: "numeric", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
  }
  const took = (ms) => (ms < 1000 ? "under 1 s" : ms < 60000 ? `${Math.round(ms / 1000)} s` : `${Math.round(ms / 60000)} min`);
  const startedAt = (r) => new Date(r.started);
  const lastLine = (r) => (r.status === "running" ? `since ${hm(startedAt(r))}` : `${/^(Today|Yesterday)$/.test(dayOf(startedAt(r))) ? dayOf(startedAt(r)).toLowerCase() : dayOf(startedAt(r))} ${hm(startedAt(r))} · took ${took(r.ms)}`);

  // ---- Where the page is: a tab (#toolkits, #machines, #runs), a function (#fn/<service>/<name>),
  // or the form that adds a machine (#add, #add/<the name the agent asked for>, #again/<machine>).
  const TABS = { toolkits: "Toolkits", machines: "Machines", runs: "Runs" };
  function place() {
    const [kind, a = "", b = ""] = decodeURIComponent(location.hash.slice(1)).split("/");
    if (kind === "fn") return { screen: "fn", service: a, name: b };
    if (kind === "add") return { screen: "add", need: NAME.test(a) ? a : null };
    if (kind === "again") return { screen: "add", again: a };
    return { tab: TABS[kind] ? kind : "toolkits" };
  }
  let lastTab = "toolkits";
  const fnHref = (service, name) => `#fn/${encodeURIComponent(service)}/${encodeURIComponent(name)}`;

  // ---- Toolkits.
  function reachOf(t) {
    const parts = [];
    if (t.hosts.length) parts.push(`Connects to ${list(t.hosts)}`);
    if (t.machines.length) parts.push(`${parts.length ? "runs" : "Runs"} on the machine${t.machines.length > 1 ? "s" : ""} ${list(t.machines)}`);
    return parts.length ? cap(parts.join("; ")) : null;
  }
  function toolkitsTab(state) {
    if (!state.toolkits.length) return [card(say("No toolkits yet. Ask the agent to connect a service, and it shows here."))];
    return state.toolkits.map((t) => card(
      el("div", { className: "head" }, el("h2", { textContent: t.title }),
        t.locked ? tag("Locked", "ok", "lock") : deleteMenu(t.title, "Its functions are deleted too. This can’t be undone.", "toolkit-delete", { service: t.service })),
      reachOf(t),
      t.functions.length ? el("div", { className: "rows" }, t.functions.map((f) => rowLink(fnHref(t.service, f.name), does(f)))) : null,
      t.locked ? null : say("Lock it once it works the way you want. The agent can’t change it after that."),
      // Lock acts at once; Unlock only the page can do, and asks first.
      acts(t.locked
        ? btn("Unlock", "", `Unlock ${t.title}`, () => ask(`Unlock ${t.title}?`, "The agent can change its functions again.", "Unlock", () => post("toolkit-unlock", { service: t.service })))
        : btn("Lock", "pri", `Lock ${t.title}`, () => post("toolkit-lock", { service: t.service })))));
  }

  // ---- A function, on its own screen.
  let codeOpen = false;
  function fnScreen(state, at) {
    const t = state.toolkits.find((x) => x.service === at.service);
    const f = t?.functions.find((x) => x.name === at.name);
    if (!f) return null;
    const pre = el("pre", { textContent: f.source });
    const code = el("details", { className: "card", open: codeOpen, ontoggle: (e) => (codeOpen = e.target.open) },
      el("summary", {}, el("span", { textContent: "Show the code" }), icon("down", 16, "chev")),
      el("div", { className: "inside" }, pre, acts(copyBtn(`Copy ${f.name}’s code`, () => f.source, pre))));
    const r = f.last;
    const run = r
      ? el("div", { className: "card lastrun ran" }, el("span", { className: "meta" }, runTag(r.status), el("span", { className: "cap", textContent: lastLine(r) })),
          r.result !== null ? el("pre", { textContent: r.result }) : r.error ? el("pre", { textContent: r.error }) : null)
      : el("div", { className: "card lastrun" }, say("It hasn’t run yet."));
    return [
      el("div", { className: "bar" }, el("a", { className: "round back", href: `#${lastTab}`, attrs: { "aria-label": `Back to ${TABS[lastTab]}` } }, icon("back", 20)),
        el("div", { className: "ttl" }, el("h1", { tabIndex: -1, textContent: f.name }), el("span", { textContent: t.title })),
        t.locked ? el("span") : deleteMenu(f.name, "This can’t be undone.", "fn-delete", { fn: `${t.service}.${f.name}` }, { cls: "round", after: () => (location.hash = `#${lastTab}`) })),
      say(`${f.description}${t.locked ? ` ${t.title} is locked, so the agent can’t change it.` : ""}`),
      el("h2", { className: "day", textContent: "Last run" }),
      run,
      code,
    ];
  }

  // ---- Runs: the last 20, in day groups, newest first.
  function runsTab(state) {
    if (!state.runs.length) return [card(say("No runs yet. Ask the agent to run a function, and it shows here."))];
    const fns = new Map(state.toolkits.flatMap((t) => t.functions.map((f) => [`${t.service}.${f.name}`, { t, f }])));
    const out = [];
    let group = null;
    for (const r of state.runs) {
      const day = dayOf(startedAt(r));
      if (day !== group?.day) out.push(el("h2", { className: "day", textContent: day }), (group = { day, node: el("div", { className: "card list" }) }).node);
      const known = fns.get(r.fn);
      const kids = [el("span", { textContent: known ? does(known.f) : r.fn }), el("span", { className: "meta" }, runTag(r.status), el("span", { className: "cap", textContent: r.status === "running" ? `since ${hm(startedAt(r))}` : hm(startedAt(r)) })), r.status === "error" && r.error ? cap(r.error) : null];
      group.node.append(known ? rowLink(fnHref(known.t.service, known.f.name), kids) : el("div", { className: "row" }, el("span", { className: "txt" }, kids)));
    }
    return out;
  }

  // ---- Machines.
  const tryAgain = (m, kind = "pri") => btn("Try again", kind, `Try signing in to ${m.label} again`, () => post("target-check", { label: m.label }));
  const setUp = (m) => el("a", { className: "btn", href: `#again/${encodeURIComponent(m.label)}`, textContent: "Set it up again" });
  // A machine that isn't signed in, by why (the skill's barred, else its problem): the tag, what the
  // card says, and its one next step.
  const NOT_IN = {
    barred: ["Not used", "bad", (m) => sentence(m.barred), (m) => tryAgain(m, "")],
    "host-key": ["Host key changed", "bad", () => "Its host key changed, so nothing was sent. If you rebuilt the machine, set it up again.", setUp],
    "this-machine": ["Not used", "bad", () => "That’s the machine AnythingLLM runs on, so nothing was sent. Set it up again with another machine’s address.", setUp],
    fenced: ["Not signed in", "warn", () => "Its name leads to an address that isn’t public, so it wasn’t reached. Set it up again with the address itself, like 192.168.1.20.", setUp],
    unreachable: ["Not signed in", "warn", (m) => `${m.label} didn’t answer at ${addressOf(m)}. Check that it’s on and its address is right, then try again.`, tryAgain],
    failed: ["Not signed in", "warn", (m) => (m.status === "not tried yet" ? "It hasn’t been tried yet." : sentence(m.status)), tryAgain],
  };
  function machineCard(m) {
    let state, body = [];
    if (m.trying) state = tag("Signing in", "", "spin");
    else if (!m.barred && m.status === "signed in") {
      state = tag("Signed in", "ok", "done");
      const id = `sw-${m.label}`;
      const sw = el("button", { className: "switch", type: "button", attrs: { role: "switch", "aria-checked": String(m.unattended), "aria-labelledby": id } });
      sw.onclick = async () => {
        const on = sw.getAttribute("aria-checked") !== "true";
        if (await post("target-unattended", { label: m.label, on })) sw.setAttribute("aria-checked", String(on));
      };
      body = [el("div", { className: "switchrow" }, el("span", { className: "say", id, textContent: "Scheduled jobs may use it", onclick: () => sw.click() }), sw)];
    } else if (!m.barred && m.problem === "key") {
      state = tag("Key refused", "bad", "warn");
      const command = m.public && setupCommand(m.public, m.label);
      if (command) {
        const pre = el("pre", { className: "cmd", textContent: command });
        body = [say(`${m.label} didn’t accept the page’s key. On ${m.label}, signed in as ${m.login}, run this command, then try again:`), pre, acts(copyBtn("Copy the command", () => command, pre))];
      } else body = [say(`${m.label} didn’t accept your key. Add its public half to ~/.ssh/authorized_keys for ${m.login} on ${m.label}, then try again.`)];
      body.push(acts(tryAgain(m)));
    } else {
      const [text, kind, says, next] = NOT_IN[m.barred ? "barred" : m.problem] ?? NOT_IN.failed;
      state = tag(text, kind, "warn");
      body = [say(says(m)), acts(next(m))];
    }
    return card(
      el("div", { className: "head" }, el("h2", { textContent: m.label }), el("span", { className: "end" }, state,
        deleteMenu(m.label, "This can’t be undone.", "target-delete", { label: m.label }))),
      cap(`${m.login}@${addressOf(m)}`, true),
      body,
      m.held ? cap(`Kept for ${S.toolkits.find((t) => t.service === m.held)?.title ?? m.held}, which is locked.`) : null);
  }
  function machinesTab(state) {
    const asking = state.needs.filter((need) => !state.targets.some((m) => m.label === need.label));
    const add = (href, text, need = false) => el("a", { className: `add${need ? " need" : ""}`, href }, icon("plus", 20), el("span", { textContent: text }), icon("next"));
    return [
      ...(state.targets.length || asking.length ? [] : [card(say("No machines. When a function needs one, the agent asks you to add it."))]),
      ...asking.map((need) => add(`#add/${encodeURIComponent(need.label)}`, `Add ${need.label}, which the agent asks for`, true)),
      ...state.targets.map(machineCard),
      add("#add", "Add a machine"),
    ];
  }

  // ---- Add a machine, in three steps. Drawn once when it opens, so what's typed stays; only the
  // command follows the name, the account and the page's key.
  let form = null; // { hash, node, refresh, answer }
  function addScreen(state, at) {
    const again = at.again ? state.targets.find((m) => m.label === at.again) : null;
    if (at.again && !again) return null;
    const named = at.need || again?.label || null;
    const inputs = {};
    const errors = {};
    const describe = (name) => (errors[name] = el("span", { className: "err", id: `err-${name}`, attrs: { role: "alert" } }));
    // Not a login form: names hold nothing a browser reads as a login, and nothing is filled in.
    const field = (name, label, { hint, mono, placeholder, value = "", textarea = false } = {}) => {
      const props = { className: `fld${mono ? " mono" : ""}`, name: `lib-${name}-${Math.random().toString(36).slice(2, 8)}`, autocomplete: "off", spellcheck: false, value, placeholder: placeholder ?? "", attrs: { autocapitalize: "none", "aria-describedby": `err-${name}` } };
      const input = (inputs[name] = textarea ? el("textarea", { ...props, rows: 4 }) : el("input", { type: "text", ...props }));
      return el("label", { className: "ff" }, el("span", { textContent: label }), input, hint ? el("span", { className: "hint", textContent: hint }) : null, describe(name));
    };
    const stepHead = (n, text) => el("div", { className: "head" }, el("span", { className: "num", textContent: String(n), attrs: { "aria-hidden": "true" } }), el("h2", {}, el("span", { className: "vh", textContent: `Step ${n}: ` }), text));
    const pre = el("pre", { className: "cmd" });
    const runText = el("p", { className: "say" });
    const own = el("details", { className: "own" }, el("summary", {}, el("span", { textContent: "Use my own key instead" }), icon("down", 16, "chev")),
      el("div", { className: "inside" }, field("key", "Private key", { mono: true, textarea: true, hint: "Without a passphrase. It’s sealed on this device; the agent never sees it." })));
    const key = inputs.key;
    const save = el("button", { className: "btn pri", type: "submit", textContent: "Save", style: "align-self:stretch" });
    const node = el("form", { className: `card${at.need ? " need" : ""}`, noValidate: true },
      el("div", { className: "step" }, stepHead(1, "Where is it?"),
        named ? null : field("label", "Name", { placeholder: "pi" }),
        field("host", "Address", { hint: "Add :port if it isn’t 22.", placeholder: "192.168.1.20", value: again ? addressOf(again) : "" }),
        field("login", "Account to sign in as", { placeholder: "pi", value: again?.login ?? "" })),
      el("div", { className: "step" }, stepHead(2, "Run this on it"), runText, pre, acts(copyBtn("Copy the command", () => pre.textContent, pre)), describe("command")),
      el("div", { className: "step" }, stepHead(3, "Paste what it printed"), field("fingerprint", "The line it printed", { mono: true, placeholder: "256 SHA256:… (ED25519)" })),
      own,
      describe("form"),
      save);
    const ownKey = () => own.open && key.value.trim() !== "";
    const name = () => named ?? inputs.label.value.trim().toLowerCase();
    // The machine's own key while it stays where it was (set up again); otherwise the page's spare.
    const keyLine = () => (again?.public && inputs.host.value.trim().toLowerCase() === addressOf(again) && inputs.login.value.trim() === again.login ? again.public : state.spare);
    function refresh(now = state) {
      state = now;
      runText.textContent = ownKey() ? "Your key goes in that account’s ~/.ssh/authorized_keys. To read the machine’s host key, run this on it:" : "Signed in as that account, paste this into the machine’s terminal:";
      pre.textContent = (ownKey() ? KEYGEN : setupCommand(keyLine(), name())) ?? "The page has no key yet: reload it.";
    }
    for (const input of [inputs.label, inputs.host, inputs.login, key]) input?.addEventListener("input", () => refresh());
    own.addEventListener("toggle", () => refresh());
    const fail = (name, text) => {
      const at = errors[name] ?? errors.form;
      at.replaceChildren(icon("warn"), el("span", { textContent: text }));
      const input = inputs[name];
      if (name === "key") own.open = true;
      input?.setAttribute("aria-invalid", "true");
      return input ?? at;
    };
    const clear = () => {
      for (const e of Object.values(errors)) e.replaceChildren();
      for (const i of Object.values(inputs)) i?.removeAttribute("aria-invalid");
    };
    let waiting = 0;
    const done = () => (clearTimeout(waiting), (waiting = 0), save.removeAttribute("aria-busy"));
    node.onsubmit = async (e) => {
      e.preventDefault();
      if (waiting) return;
      clear();
      const v = Object.fromEntries(Object.entries(inputs).map(([k, i]) => [k, i.value.trim()]));
      const bad = [];
      // Only what's left empty: the skill's refusals say the rest, under the field they concern.
      if (!named && !name()) bad.push(fail("label", "Give the machine a name, like pi."));
      if (!v.host) bad.push(fail("host", "Give the machine’s address, like 192.168.1.20."));
      if (!v.login) bad.push(fail("login", "Give the account to sign in as, like pi."));
      if (!v.fingerprint) bad.push(fail("fingerprint", "Paste the line the command printed."));
      if (bad.length) return bad[0].focus();
      const mine = ownKey();
      const sent = await post("target-save", { label: name(), host: v.host, login: v.login, fingerprint: v.fingerprint, public: mine ? "" : keyLine() ?? "", sealed: mine ? await seal(key.value.trim()) : "" });
      if (!sent) return;
      save.setAttribute("aria-busy", "true");
      waiting = setTimeout(done, 30000); // not for ever if no answer comes
    };
    // How the skill took the save: a refusal under the field it concerns, or Machines, where it signs in.
    const answer = (said) => {
      if (!waiting) return;
      done();
      if (!said.error) return void (location.hash = "#machines");
      fail(said.field ?? "form", said.error).focus();
    };
    refresh();
    form = { hash: location.hash, node, refresh, answer };
    return [
      el("div", { className: "bar" }, el("a", { className: "round back", href: "#machines", attrs: { "aria-label": "Back to Machines" } }, icon("back", 20)),
        el("div", { className: "ttl" }, el("h1", { tabIndex: -1, textContent: again ? `Set up ${again.label} again` : "Add a machine" })), el("span")),
      el("p", { className: "say", textContent: at.need ? `The agent asks for a machine named ${at.need}, to run commands on.` : again ? `Run the command on ${again.label} again, then paste what it printed.` : "A machine the agent’s functions can run commands on." }),
      node,
    ];
  }

  // ---- Drawing: the view the address names, from the state last read. A tab or a function is drawn
  // again when what it shows changes; the form only when it opens.
  let S = null;
  let shown = null;
  function draw(moved = false) {
    if (!S) return;
    const at = place();
    if (at.screen === "add" && form?.hash === location.hash) return form.refresh(S);
    const key = JSON.stringify([location.hash, at.tab === "toolkits" ? S.toolkits : at.tab === "machines" ? [S.needs, S.targets] : at.tab === "runs" ? [S.runs, S.toolkits] : S.toolkits, at.screen === "add" ? S.targets : null]);
    if (key === shown && !moved) return;
    closeMenu();
    if (at.screen !== "add") form = null;
    if (at.tab) {
      lastTab = at.tab;
      for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-selected", String(b.dataset.tab === at.tab));
      $("tab").replaceChildren(...(at.tab === "machines" ? machinesTab(S) : at.tab === "runs" ? runsTab(S) : toolkitsTab(S)));
      $("tab").setAttribute("aria-label", TABS[at.tab]);
      $("home").hidden = false;
      $("screen").hidden = true;
    } else {
      const kids = at.screen === "fn" ? fnScreen(S, at) : addScreen(S, at);
      if (!kids) return location.replace(`#${lastTab}`); // gone: a function deleted, a machine removed
      $("screen").replaceChildren(...kids);
      $("home").hidden = true;
      $("screen").hidden = false;
    }
    shown = key;
    if (moved) (at.tab ? $("home") : $("screen")).querySelector("h1")?.focus(), scrollTo(0, 0);
  }
  addEventListener("hashchange", () => {
    if (place().screen !== "fn") codeOpen = false;
    draw(true);
  });

  // What the skill said of the last thing it was asked: a refusal, or a machine saved. The first state
  // read has an old one at most, which isn't news.
  let seen = null;
  function answered(state) {
    const n = state.result ? state.result.n : 0;
    const news = seen !== null && n > seen;
    seen = n;
    if (!news) return;
    if (state.result.ev === "target-save" && form) form.answer(state.result);
    else if (state.result.error) toast(state.result.error);
  }

  let lastRead = null;
  async function load() {
    try {
      const res = await fetch(cfg.token + ".json", { cache: "no-cache" });
      // Gone: AnythingLLM answers a path it doesn't serve with its own page, 200.
      if (res.status === 404 || (res.ok && !/json/i.test(res.headers.get("content-type") || ""))) return clearInterval(poll), toast("This link was replaced. Open the page again from where you got it: the agent, AnywhereLLM Lite, or anywherellm-suite pages."); // gone for good: said once
      const text = await res.text();
      if (text === lastRead) return; // as it was: nothing to draw
      lastRead = text;
      const first = S === null;
      S = JSON.parse(text);
      // Opened while the agent asks for a machine: Machines, where it's added.
      if (first && !location.hash && S.needs.length) history.replaceState(null, "", "#machines");
      draw();
      answered(S);
    } catch (e) {
      toast("Can’t reach AnythingLLM. Check your connection, then try again.");
    }
  }

  function replaceLink() {
    ask("Replace this page’s link?", "Anyone with the link can see this page and act on it. The old link stops working.", "Replace link", () => post("rotate"));
  }
  for (const b of document.querySelectorAll("nav button")) b.onclick = () => (location.hash = `#${b.dataset.tab}`);
  $("rotate").onclick = replaceLink;
  const poll = setInterval(load, 5000);
  load();
})();
</script>
</body>
</html>
